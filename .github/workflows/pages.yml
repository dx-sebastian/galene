name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    # ── POR QUÉ ESTE TRABAJO TAMBIÉN DECLARA EL ENTORNO ──────────────
    # Porque «Settings → Secrets and variables → Actions» y «Settings →
    # Environments → github-pages» son dos sitios distintos donde poner
    # lo mismo, y solo uno de los dos lo ve un trabajo que no declara
    # `environment`. MEDIDO el 18 ago 2026: tres despliegues seguidos
    # publicaron el sitio sin foro, y el diagnóstico de abajo dijo que
    # este trabajo veía CERO variables de repositorio — o sea que las
    # que había estaban en el otro sitio.
    #
    # Declararlo aquí hace que las dos fuentes valgan. No añade riesgo:
    # el trabajo `publicar` ya usa este mismo entorno y pasa, así que no
    # hay revisores ni esperas que puedan bloquear a nadie.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── LAS LLAVES DEL FORO, EN TIEMPO DE COMPILACIÓN ───────────────
      # Astro INSERTA las `PUBLIC_*` en el paquete al compilar: no se
      # leen en el navegador, se quedan escritas dentro. Así que tienen
      # que estar aquí, en el paso de build, o no estarán nunca.
      #
      # Se leen de `vars` primero y de `secrets` después, para que
      # funcione se hayan puesto donde se hayan puesto. La `anon` es
      # PÚBLICA por diseño —viaja en el paquete que descarga cualquiera,
      # y lo que decide qué puede hacer es RLS, no el secreto de la
      # llave—, así que `vars` es su sitio natural. La `service_role`
      # NUNCA va aquí: esa se salta todas las políticas.
      #
      # Si faltan, el sitio se publica igual y el foro sale diciendo que
      # no se pudo llegar a la comunidad. Es un estado declarado y
      # medido (foro.spec.js), no una página rota.
      # ── ¿ESTÁN O NO ESTÁN? ──────────────────────────────────────────
      # Sin esto, unas variables mal puestas se ven así: el flujo en
      # verde, el sitio publicado, y el foro diciendo que no se pudo
      # llegar. Un despliegue que sale bien no es lo mismo que un
      # despliegue que hizo lo que se esperaba.
      #
      # NO IMPRIME LOS VALORES. Solo si cada sitio tiene algo y cuánto
      # mide, que es lo que hace falta para distinguir «no las puse»
      # de «las puse en el sitio equivocado» de «me comí una letra del
      # nombre». La `anon` es pública de todas formas, pero un registro
      # de Actions es público en un repo público y no hay motivo para
      # regalar nada.
      - name: Ver si las llaves de Supabase llegaron al build
        env:
          V_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          S_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          V_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          S_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          medir() { if [ -n "$2" ]; then echo "  $1: sí, ${#2} caracteres"; else echo "  $1: vacío"; fi; }
          echo "Variables del repositorio (Settings → Secrets and variables → Actions):"
          medir "vars.PUBLIC_SUPABASE_URL     " "$V_URL"
          medir "vars.PUBLIC_SUPABASE_ANON_KEY" "$V_KEY"
          medir "secrets.PUBLIC_SUPABASE_URL     " "$S_URL"
          medir "secrets.PUBLIC_SUPABASE_ANON_KEY" "$S_KEY"
          if [ -z "$V_URL$S_URL" ] || [ -z "$V_KEY$S_KEY" ]; then
            echo ""
            echo "Variables que este trabajo SÍ ve, por nombre:"
            # Solo los NOMBRES. `vars` no es secreto —GitHub ni siquiera lo
            # enmascara— pero los valores no hacen falta para diagnosticar y
            # un registro de Actions es público en un repo público.
            #
            # Esto es lo que distingue las tres causas de un tirón: la lista
            # vacía significa que no hay ninguna variable de repositorio (o
            # que están en Environments, que este trabajo no mira); una lista
            # con otros nombres significa que el nombre lleva una errata.
            echo '${{ toJSON(vars) }}' | jq -r 'if length == 0 then "  (ninguna)" else keys[] | "  " + . end'
            echo ""
            echo "::warning::El sitio se va a publicar SIN foro."
            echo "::warning::Tienen que estar en Settings → Secrets and variables → Actions,"
            echo "::warning::pestaña Variables, a nivel de REPOSITORIO. Unas puestas en"
            echo "::warning::Settings → Environments → github-pages no las ve este trabajo,"
            echo "::warning::porque no declara \`environment\`."
          fi

      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
